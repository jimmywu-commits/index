<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner Tool 連結管理</title>
<style>
:root{--ink:#152544;--muted:#68758f;--line:#dce4f0;--blue:#2458c6;--bg:#f4f7fc;--green:#16784a;--amber:#8a5c08}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#edf4ff 0,#f6f8fc 42%,#f1f4f9 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}
.wrap{max-width:1440px;margin:auto;padding:28px 30px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:15px}.logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#2563eb,#60a5fa);display:grid;place-items:center;color:#fff;font-size:26px;box-shadow:0 8px 20px #2563eb30}
h1{font-size:30px;line-height:1.15;margin:0;letter-spacing:-.03em}.subtitle{color:var(--muted);margin-top:6px;font-size:15px}
.btn{border:0;border-radius:11px;padding:12px 16px;background:linear-gradient(135deg,#10264d,#234777);color:white;text-decoration:none;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.secondary{background:#edf2ff;color:#234da7;border:1px solid #dbe5ff}.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 9px 25px #172c4d0b;margin-bottom:18px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.step{background:#f7f9fd;border:1px solid var(--line);border-radius:13px;padding:13px 15px;color:#52617b;line-height:1.55;font-size:14px}.step b{display:block;color:var(--ink);margin-bottom:2px}
.status{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 14px;border:1px solid #dbe6fa;border-radius:12px;background:#f2f7ff;color:#2e4f88;font-size:14px;line-height:1.5}.dot{width:9px;height:9px;background:#5383d6;border-radius:50%;flex:none}.status.ready{background:#effaf4;border-color:#ccebd9;color:#276244}.status.ready .dot{background:#2e9b60}.status.unsaved{background:#fff8e9;border-color:#f1dfae;color:#805a10}.status.unsaved .dot{background:#d79718}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.file-picker{display:none}.search{margin-left:auto;min-width:240px;flex:0 1 360px;height:44px;padding:0 13px;border:1px solid var(--line);border-radius:11px;font-family:inherit;font-size:15px;color:var(--ink);background:#fff}
.heading{display:flex;justify-content:space-between;align-items:end;gap:14px;margin:22px 0 12px}.heading h2{margin:0;font-size:20px}.count{font-size:13px;color:var(--muted)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:850px}thead{background:#f5f7fb;color:#64718a;font-size:12px;text-align:left}th{padding:12px 15px;font-weight:800;white-space:nowrap}td{padding:12px 15px;border-top:1px solid #edf0f5;vertical-align:middle}.group-row td{background:#f8faff;color:#314466;font-weight:850;border-top:1px solid var(--line);padding-top:10px;padding-bottom:10px}.placement{font-weight:800}.button-name{font-weight:750}.sub{font-size:12px;color:var(--muted);margin-top:4px}.pill{display:inline-block;border-radius:99px;padding:3px 8px;background:#f0f2f6;color:#67738a;font-size:11px;font-weight:750;margin-left:6px;white-space:nowrap}
.url{width:100%;min-width:300px;height:42px;border:1px solid #d6deeb;border-radius:9px;padding:0 11px;color:#18325d;font-family:inherit;font-size:14px;background:#fff}.url:focus,.search:focus{outline:3px solid #4f83ef30;border-color:#6b94e8}.tag{display:inline-block;background:#edf3ff;color:#315696;border-radius:7px;padding:4px 8px;font-size:12px;font-weight:750;white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--muted)}.note{margin:12px 2px 0;color:var(--muted);font-size:13px;line-height:1.65}.footer{display:flex;justify-content:flex-end;gap:10px;margin-top:15px}
@media(max-width:760px){.wrap{padding:18px 14px 32px}header{align-items:flex-start;flex-direction:column}h1{font-size:25px}.steps{grid-template-columns:1fr}.panel{padding:15px}.search{margin-left:0;flex-basis:100%;max-width:none}.toolbar .btn{flex:1}.heading{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><div class="logo" aria-hidden="true">↗</div><div><h1>Banner Tool 連結管理</h1><div class="subtitle">集中更新前台按鈕網址，其他版位資料會原樣保留。</div></div></div>
  <a class="btn secondary" href="bnindex.html">回前台</a>
</header>

<section class="panel" aria-label="更新步驟">
  <div class="steps">
    <div class="step"><b>1. 匯入目前資料</b>選擇前台正在使用的 <code>banner-tools-data.json</code></div>
    <div class="step"><b>2. 更新按鈕網址</b>每個尺寸按鈕只需改一次，兩處前台入口會同步使用</div>
    <div class="step"><b>3. 下載並替換</b>下載更新後的 JSON，覆蓋前台資料夾中的同名檔案</div>
  </div>
  <div id="status" class="status"><span class="dot"></span><span id="statusText"></span></div>
</section>

<section class="panel">
  <div class="toolbar">
    <label class="btn secondary" for="importFile">匯入目前 JSON</label>
    <input class="file-picker" type="file" id="importFile" accept=".json,application/json">
    <button class="btn" id="exportJson">儲存並下載 JSON</button>
    <button class="btn secondary" id="undoChanges" disabled>還原尚未下載的修改</button>
    <input class="search" id="search" type="search" placeholder="搜尋版位或按鈕名稱…" aria-label="搜尋版位或按鈕名稱">
  </div>
  <div class="heading"><h2>前台按鈕網址</h2><span id="count" class="count"></span></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>版位</th><th>前台按鈕</th><th>尺寸／平台</th><th>按鈕連結</th></tr></thead>
      <tbody id="linkRows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>沒有符合的按鈕。</div>
  </div>
  <p class="note">尺寸按鈕的網址會同時用於版位卡片與「常用尺寸」；底部提示按鈕則獨立設定。輸入後會暫存在此瀏覽器，按「儲存並下載 JSON」才會產生可替換到前台的檔案。</p>
</section>
</div>

<script>
const STORAGE_KEY = 'bannerToolsDataV1';
const DEFAULT_DATA = {
  version: '1.0.0', updatedAt: '2026-05-25',
  siteSettings: {
    noticeText: '☆ 小提醒：點擊版位卡片或尺寸卡片後，將導向製作工具開始編輯。',
    noticeButtonText: '前往使用說明', noticeButtonUrl: '#'
  },
  placements: [
    {id:'brand-max-bn',name:'Brand max BN',theme:'blue',icon:'★',badge:'熱門',description:'品牌最大曝光版位，適合大型活動與主視覺呈現。',toolUrl:'https://github.com/',order:1,status:'active',sizes:[
      {id:'dd-card-bn',name:'DD Card BN',width:531,height:792,platform:'All',icon:'▯',color:'si-blue',toolUrl:'https://github.com/',order:1,status:'active'},
      {id:'c2c-hbn',name:'C2C HBN',width:1200,height:360,platform:'All',icon:'▭',color:'si-purple',toolUrl:'https://github.com/',order:2,status:'active'}]},
    {id:'sba',name:'SBA',theme:'purple',icon:'▣',badge:'熱門',description:'SBA 活動版位，適用於多種促銷與曝光需求。',toolUrl:'https://github.com/',order:2,status:'active',sizes:[
      {id:'sba-banner',name:'SBA Banner',width:1200,height:360,platform:'All',icon:'▭',color:'si-purple',toolUrl:'https://github.com/',order:1,status:'active'}]},
    {id:'jbp',name:'JBP單店資交',theme:'green',icon:'▤',badge:'最新',description:'JBP 單店資交版位，提升單店曝光度。',toolUrl:'https://github.com/',order:3,status:'active',sizes:[
      {id:'jbp-banner',name:'JBP Banner',width:1200,height:360,platform:'All',icon:'▭',color:'si-green',toolUrl:'https://github.com/',order:1,status:'active'}]},
    {id:'home-bn',name:'首頁BN',theme:'orange',icon:'⌂',badge:'熱門',description:'首頁主視覺 Banner，適合品牌與大型活動曝光。',toolUrl:'https://github.com/',order:4,status:'active',sizes:[
      {id:'search-banner-app',name:'Search Banner (App)',width:1200,height:400,platform:'App',icon:'▯',color:'si-green',toolUrl:'https://github.com/',order:1,status:'active'},
      {id:'search-banner-pc',name:'Search Banner (PC)',width:1200,height:200,platform:'PC',icon:'▭',color:'si-orange',toolUrl:'https://github.com/',order:2,status:'active'}]}
  ]
};
let data, baseline, dirty=false, sourceMessage='';
const $=id=>document.getElementById(id);
function clone(value){return JSON.parse(JSON.stringify(value))}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function validData(value){return !!value&&typeof value==='object'&&!Array.isArray(value)&&Array.isArray(value.placements)}
function sortByOrder(a,b){return (Number(a.order)||999)-(Number(b.order)||999)}
function init(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(validData(saved)){data=saved;sourceMessage='已載入這個瀏覽器上次儲存的資料。若要確認正式前台版本，建議先匯入目前使用的 JSON。'}
    else {data=clone(DEFAULT_DATA);sourceMessage='目前顯示內建範例資料。請先匯入正式前台的 banner-tools-data.json，再更新連結。'}
  }catch(_){data=clone(DEFAULT_DATA);sourceMessage='目前顯示內建範例資料。請先匯入正式前台的 banner-tools-data.json，再更新連結。'}
  baseline=clone(data);render();setStatus(sourceMessage,'');
}
function currentRows(){
  const rows=[];
  [...(data.placements||[])].sort(sortByOrder).forEach(p=>{
    const sizes=[...(Array.isArray(p.sizes)?p.sizes:[])].sort(sortByOrder);
    if(sizes.length){
      sizes.forEach(s=>rows.push({kind:'size',p,s,name:s.name||'未命名尺寸',dimension:[s.width&&s.height?`${s.width} × ${s.height}`:'',s.platform&&s.platform!=='All'?s.platform:''].filter(Boolean).join(' / ')||'未設定尺寸',url:s.toolUrl??'',inactive:p.status==='inactive'||s.status==='inactive'}));
    }else{
      rows.push({kind:'placement',p,name:'開始製作',dimension:'版位預設按鈕',url:p.toolUrl??'',inactive:p.status==='inactive'});
    }
  });
  const settings=data.siteSettings||{};
  rows.push({kind:'notice',p:{name:'全站提示'},name:settings.noticeButtonText||'前往使用說明',dimension:'底部提示按鈕',url:settings.noticeButtonUrl??'',inactive:false});
  return rows;
}
function render(){
  const query=$('search').value.trim().toLowerCase();
  const all=currentRows();
  const filtered=all.filter(row=>`${row.p.name||''} ${row.name} ${row.dimension}`.toLowerCase().includes(query));
  let lastPlacement=null,html='';
  filtered.forEach(row=>{
    const groupName=row.kind==='notice'?'其他前台連結':(row.p.name||'未命名版位');
    if(groupName!==lastPlacement){html+=`<tr class="group-row"><td colspan="4">${escapeHtml(groupName)}</td></tr>`;lastPlacement=groupName}
    const pId=row.p.id||'';
    const sId=row.s?.id||'';
    const attrs=`data-kind="${row.kind}" data-pid="${escapeHtml(pId)}" data-sid="${escapeHtml(sId)}"`;
    html+=`<tr>
      <td class="placement">${row.kind==='notice'?'全站提示':escapeHtml(row.p.name||'未命名版位')}${row.inactive?'<span class="pill">停用中</span>':''}</td>
      <td class="button-name">${escapeHtml(row.name)}</td>
      <td><span class="tag">${escapeHtml(row.dimension)}</span></td>
      <td><input class="url" type="text" ${attrs} value="${escapeHtml(row.url)}" placeholder="貼上網址；空白連結無法下載" spellcheck="false" aria-label="${escapeHtml(groupName+' '+row.name+' 的按鈕連結')}"></td>
    </tr>`;
  });
  $('linkRows').innerHTML=html;
  $('empty').hidden=filtered.length>0;
  $('count').textContent=`顯示 ${filtered.length} 個按鈕，共 ${all.length} 個`;
  $('linkRows').querySelectorAll('.url').forEach(input=>input.addEventListener('input',onLinkInput));
  $('undoChanges').disabled=!dirty;
}
function setStatus(message,type){$('statusText').textContent=message;$('status').className='status'+(type?' '+type:'')}
function saveDraft(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(_){}}
function locatePlacement(id){return (data.placements||[]).find(p=>String(p.id)===id)}
function onLinkInput(event){
  const input=event.currentTarget,kind=input.dataset.kind,value=input.value;
  if(kind==='notice'){
    data.siteSettings=data.siteSettings||{};
    data.siteSettings.noticeButtonUrl=value;
  }else{
    const p=locatePlacement(input.dataset.pid);
    if(!p)return;
    if(kind==='placement')p.toolUrl=value;
    else {const s=(p.sizes||[]).find(item=>String(item.id)===input.dataset.sid);if(s)s.toolUrl=value}
  }
  dirty=true;saveDraft();$('undoChanges').disabled=false;
  setStatus('連結已暫存在此瀏覽器，尚未下載 JSON。','unsaved');
}
function dateStamp(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function exportData(){
  const missing=currentRows().filter(row=>!String(row.url||'').trim());
  if(missing.length){alert(`有 ${missing.length} 個按鈕連結為空白，請補上網址後再下載。`);return}
  data.updatedAt=dateStamp();
  const content=JSON.stringify(data,null,2);
  const blob=new Blob([content],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='banner-tools-data.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  saveDraft();baseline=clone(data);dirty=false;render();setStatus('更新 JSON 已下載。請用它覆蓋前台資料夾中的 banner-tools-data.json。','ready');
}
$('search').addEventListener('input',render);
$('exportJson').addEventListener('click',exportData);
$('undoChanges').addEventListener('click',()=>{
  if(!dirty)return;
  if(!confirm('還原所有尚未下載的連結修改？'))return;
  data=clone(baseline);dirty=false;saveDraft();render();setStatus('已還原到本次匯入或上次下載的資料。','');
});
$('importFile').addEventListener('change',event=>{
  const file=event.target.files&&event.target.files[0];if(!file)return;
  if(dirty&&!confirm('目前有尚未下載的修改。匯入新 JSON 會捨棄這些修改，是否繼續？')){event.target.value='';return}
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const imported=JSON.parse(reader.result);
      if(!validData(imported))throw new Error('JSON 中找不到 placements 陣列');
      data=imported;baseline=clone(data);dirty=false;sourceMessage=`已匯入「${file.name}」。更新連結後按「儲存並下載 JSON」。`;
      saveDraft();render();setStatus(sourceMessage,'ready');
    }catch(error){alert(`無法匯入：${error.message||'JSON 格式錯誤'}。請選擇前台使用的 banner-tools-data.json。`)}
    event.target.value='';
  };
  reader.onerror=()=>{alert('檔案讀取失敗，請重新選擇 JSON。');event.target.value=''};
  reader.readAsText(file);
});
init();
</script>
</body>
</html>
