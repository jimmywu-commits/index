<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM 工具案例庫</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://script.google.com/a/macros/shopee.com/s/AKfycby5vABc_aC47quF4LF_rFeY2JyDhRnbQs6OLzU8_pTu2JohMftLp5TQex4NQ_gn4Wn6/exec">
<script>
  // 轉到 LLM 工具案例庫（Apps Script 網頁應用程式），並保留 ?參數 和 #錨點（例如 #all 直接打開「查詢所有專案」）；replace 不會在上一頁留下這個轉址頁
  location.replace('https://script.google.com/a/macros/shopee.com/s/AKfycby5vABc_aC47quF4LF_rFeY2JyDhRnbQs6OLzU8_pTu2JohMftLp5TQex4NQ_gn4Wn6/exec' + location.search + location.hash);
</script>
<style>
  :root { --bg: #f5f6f8; --surface: #fff; --text: #1c2430; --text-2: #545e6c; --accent: #4f46e5; --on-accent: #fff; --border: #e3e6eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --surface: #171b21; --text: #e8ebf0; --text-2: #aab2be; --accent: #818cf8; --on-accent: #0f1216; --border: #2a313b; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  main {
    width: 100%; max-width: 420px; text-align: center; padding: 32px 24px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--text-2); margin: 0 0 20px; line-height: 1.6; }
  a {
    display: inline-block; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600;
    background: var(--accent); color: var(--on-accent);
  }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  small { display: block; margin-top: 16px; color: var(--text-2); }
</style>
</head>
<body>
<main>
  <h1>LLM 工具案例庫</h1>
  <p>正在前往案例庫……<br>如果沒有自動跳轉，請點下面的按鈕。</p>
  <a id="go" href="https://script.google.com/a/macros/shopee.com/s/AKfycby5vABc_aC47quF4LF_rFeY2JyDhRnbQs6OLzU8_pTu2JohMftLp5TQex4NQ_gn4Wn6/exec">開啟 LLM 工具案例庫</a>
  <small>需要用 Shopee 帳號登入</small>
</main>
<script>
  // 手動點按鈕時一樣帶上 ?參數 和 #錨點
  document.getElementById('go').href += location.search + location.hash;
</script>
</body>
</html>
